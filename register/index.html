<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gym Prototype - Cadastro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-bar">
        <button class="icon-button" type="button" data-action="back">Voltar</button>
        <div>
          <p class="eyebrow">Cadastro</p>
          <h1>Crie sua conta</h1>
        </div>
      </header>

      <section class="hero">
        <h2>Bem-vindo ao Gym Prototype</h2>
        <p class="subtitle">Informe seus dados e comece a usar o app.</p>
      </section>

      <section class="gym-card">
        <form id="registerForm" class="form-stack" novalidate>
          <label class="field-label" for="userName">Nome completo</label>
          <input class="form-input" id="userName" type="text" placeholder="Seu nome" required />

          <label class="field-label" for="userEmail">Email</label>
          <input class="form-input" id="userEmail" type="email" placeholder="seu@email.com" required />

          <label class="field-label" for="userPassword">Senha</label>
          <input class="form-input" id="userPassword" type="password" placeholder="••••••••" required />

          <label class="field-label" for="confirmPassword">Confirmar senha</label>
          <input class="form-input" id="confirmPassword" type="password" placeholder="••••••••" required />

          <div class="form-actions">
            <button class="btn-secondary" type="button" data-action="back">Cancelar</button>
            <button class="btn-primary" type="submit">Criar conta</button>
          </div>
        </form>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
