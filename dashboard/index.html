<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gym Prototype - Home</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-bar">
        <div>
          <p class="eyebrow">Bem-vindo</p>
          <h1>Seu painel</h1>
        </div>
        <button class="icon-button" type="button" id="logoutButton">Sair</button>
      </header>

      <section class="hero">
        <h2>Você já está logado</h2>
        <p class="subtitle">Acesse sua biblioteca de vídeos para continuar seu treino.</p>
        <p class="welcome-text" id="welcomeText"></p>
      </section>

      <section class="gym-card">
        <p class="section-title">Acesso rápido</p>
        <div class="dashboard-actions">
          <button class="btn-primary" id="libraryButton" type="button">Abrir Biblioteca de Vídeos</button>
          <button class="btn-secondary" id="painRegistrationButton" type="button">Cadastrar dores</button>
          <button class="btn-secondary" id="recommendationsButton" type="button">Ver recomendações</button>
        </div>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <nav class="tab-bar" aria-label="Navegacao principal">
        <button class="tab-button active" type="button" data-page="Dashboard" data-target="../dashboard/index.html">Dashboard</button>
        <button class="tab-button" type="button" data-page="Biblioteca" data-target="../video-library/index.html">Biblioteca</button>
        <button class="tab-button" type="button" data-page="Dores" data-target="../pain-registration/index.html">Dores</button>
        <button class="tab-button" type="button" data-page="Recomendações" data-target="../recommendations/index.html">Recomendações</button>
      </nav>
    </main>

    <script src="script.js"></script>
  </body>
</html>
